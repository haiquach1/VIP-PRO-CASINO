name: Build VIP PRO CASINO from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -q VIP_PRO_CASINO_FULL_1_TO_9.zip -d unpacked
          cp -a unpacked/VIP_PRO_CASINO/. .
    
      - name: Inspect game source
        run: |
          echo "===== PROJECT FILES ====="
          find app/src -type f 2>/dev/null | head -100

          echo "===== GAME LOGIC ====="
          grep -RInE 'demo|balance|money|coin|wallet|game' app/src --include="*.kt" --include="*.java" --include="*.html" --include="*.js" | head -150 || true
          
      - name: Force JVM 17 and Add AndroidX
        run: |
          if [ -f "app/build.gradle" ]; then
            cat << 'EOF' >> app/build.gradle

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.activity:activity-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF
          elif [ -f "app/build.gradle.kts" ]; then
            cat << 'EOF' >> app/build.gradle.kts

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.activity:activity-ktx:1.9.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF
          fi

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          
