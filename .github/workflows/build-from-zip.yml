name: Build VIP PRO CASINO from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -q VIP_PRO_CASINO_FULL_1_TO_9.zip -d unpacked
          cp -a unpacked/VIP_PRO_CASINO/. .

      - name: Fix JVM target compatibility
        run: |
          find . -name "build.gradle*" -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} +
          find . -name "build.gradle*" -exec sed -i 's/1\.8/17/g' {} +

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
