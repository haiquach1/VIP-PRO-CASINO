
name: Build VIP PRO CASINO from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -q VIP_PRO_CASINO_FULL_1_TO_9.zip -d unpacked
          cp -a unpacked/VIP_PRO_CASINO/. .

      
      - name: Inspect Gradle JVM targets
        run: |
          echo "=== Gradle files ==="
          find . -maxdepth 5 \( -name "build.gradle" -o -name "build.gradle.kts" \) -print

          echo "=== JVM configuration ==="
          grep -RInE 'sourceCompatibility|targetCompatibility|jvmTarget|VERSION_1_8' --include="*.gradle" --include="*.gradle.kts" . || true

      - name: Build APK
        run: gradle --no-daemon assembleDebug
        

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIP-PRO-CASINO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
